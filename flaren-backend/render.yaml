services:
  - type: web
    name: flaren-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: flaren-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: data/flaren.db
      - key: CORS_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.10"