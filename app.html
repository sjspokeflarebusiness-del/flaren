<script>

 OneSignalDeferred.push(async function(OneSignal) {

    appId: "98c56f52-d557-4b34-9f4b-5c78a08a6889",

});
</script>

<script defer src="https://cloud.umami.is/script.js" data-website-id="323ddd38-4d0a-4665-8b9a-eb2e2bde48c3"></script>

  </div>

  <script src="auth-client.js"></script>
